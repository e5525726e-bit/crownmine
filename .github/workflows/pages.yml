name: 網頁版（GitHub Pages）

# 建置 Flutter 網頁版並推到 gh-pages 分支，由 GitHub Pages 發布：
#   https://e5525726e-bit.github.io/crownmine/
# 若沒有自動啟用，到 Settings → Pages → Source 選 gh-pages 分支。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: 建置網頁版
        run: |
          KEY=$(jq -r .GOOGLE_PLACES_API_KEY dart_defines.json)
          flutter pub get
          flutter build web --release \
            --dart-define-from-file=dart_defines.json \
            --base-href "/${{ github.event.repository.name }}/" \
            --pwa-strategy=none
          sed -i "s#__MAPS_API_KEY__#${KEY}#" build/web/index.html
          rm -f build/web/.last_build_id
          cp build/web/index.html build/web/404.html
          touch build/web/.nojekyll
      - name: 推到 gh-pages 分支
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 網頁版建置 ${{ github.sha }}
