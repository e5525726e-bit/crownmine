name: Supabase 部署後端函式

# 部署 Google Places 代理函式，並把 Google 金鑰設成函式的 secret。
# 權杖來自 repo 的 Secret「SUPABASE_ACCESS_TOKEN」（Settings → Secrets and variables → Actions），
# 不再用輸入框，避免印進公開的執行紀錄。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 部署
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::尚未設定 Secret SUPABASE_ACCESS_TOKEN（repo Settings → Secrets and variables → Actions → New repository secret）"; exit 1
          fi
          ref=$(jq -r .SUPABASE_URL dart_defines.json | sed -E 's#https://([^.]+)\.supabase\.co#\1#')
          key=$(jq -r .GOOGLE_PLACES_API_KEY dart_defines.json)
          echo "::add-mask::$key"
          for f in 0005_places_proxy.sql 0006_plans.sql 0007_more_tags.sql 0008a_rich_verdict.sql 0008b_rich_stats.sql 0009_poop_fire_tags.sql; do
            echo "==> 執行 migration $f"
            result=$(curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              -X POST "https://api.supabase.com/v1/projects/$ref/database/query" \
              -d "$(jq -n --rawfile q "supabase/migrations/$f" '{query:$q}')")
            if echo "$result" | jq -e 'type=="object" and .message' >/dev/null 2>&1; then
              echo "::error::SQL 失敗：$(echo "$result" | jq -r .message)"; exit 1
            fi
          done
          echo "==> 設定函式 secret"
          npx --yes supabase@latest secrets set --project-ref "$ref" GOOGLE_PLACES_API_KEY="$key"
          echo "==> 部署函式 places"
          npx --yes supabase@latest functions deploy places --project-ref "$ref" --no-verify-jwt
          echo "==> 驗證"
          url=$(jq -r .SUPABASE_URL dart_defines.json)
          curl -sS -X POST "$url/functions/v1/places/search" -H "Content-Type: application/json" \
            -d '{"query":"台北 牛肉麵"}' | jq -c '{n: (.places | length), first: .places[0].displayName.text, error}'
