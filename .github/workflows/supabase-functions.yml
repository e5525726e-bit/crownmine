name: Supabase 部署後端函式

# 部署 Google Places 代理函式，並把 Google 金鑰設成函式的 secret。
# 權杖來自 repo 的 Secret「SUPABASE_ACCESS_TOKEN」（Settings → Secrets and variables → Actions），
# 不再用輸入框，避免印進公開的執行紀錄。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 部署
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GOOGLE_SERVER_KEY: ${{ secrets.GOOGLE_SERVER_KEY }}
        run: |
          set -euo pipefail
          # 去掉貼上時可能夾帶的換行或空白
          SUPABASE_ACCESS_TOKEN=$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '[:space:]')
          export SUPABASE_ACCESS_TOKEN
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::尚未設定 Secret SUPABASE_ACCESS_TOKEN（repo Settings → Secrets and variables → Actions → New repository secret）"; exit 1
          fi
          ref=$(jq -r .SUPABASE_URL dart_defines.json | sed -E 's#https://([^.]+)\.supabase\.co#\1#')
          # 後端用的 Google 金鑰：優先用 Secret GOOGLE_SERVER_KEY（只開 Places API、不限網站），
          # 沒設定時退回 dart_defines.json 那把（給地圖用的公開金鑰）
          key=$(printf '%s' "$GOOGLE_SERVER_KEY" | tr -d '[:space:]')
          if [ -n "$key" ]; then echo "==> 使用後端專用金鑰（Secret）"; else key=$(jq -r .GOOGLE_PLACES_API_KEY dart_defines.json); echo "==> 未設定 GOOGLE_SERVER_KEY，沿用公開金鑰"; fi
          echo "::add-mask::$key"
          sql() {  # 執行一段 SQL，失敗就結束
            local out
            out=$(curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
              -X POST "https://api.supabase.com/v1/projects/$ref/database/query" \
              -d "$(jq -n --arg q "$1" '{query:$q}')")
            if echo "$out" | jq -e 'type=="object" and .message' >/dev/null 2>&1; then
              echo "::error::SQL 失敗：$(echo "$out" | jq -r .message)"; exit 1
            fi
            echo "$out"
          }
          # 記錄已執行過的 migration，之後只跑新的（重跑舊的會因資料已改變而失敗）
          sql "create table if not exists public.schema_migrations (name text primary key, applied_at timestamptz not null default now());" >/dev/null
          # 這個專案在加入此紀錄表之前已套用到 0011（0001 也已包含全部內容），先補記
          sql "insert into public.schema_migrations(name) select unnest(array['0005_places_proxy.sql','0006_plans.sql','0007_more_tags.sql','0008a_rich_verdict.sql','0008b_rich_stats.sql','0009_poop_fire_tags.sql','0010_negative_body.sql','0011_place_types.sql']) on conflict do nothing;" >/dev/null
          applied=$(sql "select coalesce(json_agg(name), '[]') from public.schema_migrations;" | jq -r '.[0].coalesce // .[0].json_agg // "[]"')
          for f in $(ls supabase/migrations | grep -E '^00(0[5-9]|[1-9][0-9])' | sort); do
            if echo "$applied" | jq -e --arg f "$f" 'index($f) != null' >/dev/null 2>&1; then
              echo "==> 已套用過，略過 $f"; continue
            fi
            echo "==> 執行 migration $f"
            sql "$(cat "supabase/migrations/$f")" >/dev/null
            sql "insert into public.schema_migrations(name) values ('$f') on conflict do nothing;" >/dev/null
          done
          echo "==> Auth 安全設定（密碼至少 8 字、擋外洩密碼、登入轉址只允許自家網址）"
          site="https://e5525726e-bit.github.io/crownmine/"
          curl -sS -X PATCH "https://api.supabase.com/v1/projects/$ref/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "{\"password_min_length\":8,\"password_hibp_enabled\":true,\"site_url\":\"$site\",\"uri_allow_list\":\"$site,${site}*\"}" \
            | jq -c 'if type=="object" and has("password_min_length") then {password_min_length, password_hibp_enabled, site_url, uri_allow_list, mailer_autoconfirm} else . end' || true
          echo "==> 設定函式 secret"
          npx --yes supabase@latest secrets set --project-ref "$ref" GOOGLE_PLACES_API_KEY="$key"
          echo "==> 部署函式 places"
          npx --yes supabase@latest functions deploy places --project-ref "$ref" --no-verify-jwt
          echo "==> 驗證"
          url=$(jq -r .SUPABASE_URL dart_defines.json)
          # 用帶時間的查詢字串避開快取，確定真的問到 Google（驗證金鑰可用）
          res=$(curl -sS -D /tmp/sh -X POST "$url/functions/v1/places/search" -H "Content-Type: application/json" -d "{\"query\":\"牛肉麵 台北 $(date +%m%d%H%M)\"}")
          echo "$res" | jq -c '{n: (.places | length), first: .places[0].displayName.text, error}'
          grep -i "x-cache" /tmp/sh || true
          echo "==> 今日用量（前 8 名，主體已遮蔽）"
          sql "select regexp_replace(subject, '^(user|ip):[^:]*', '\\1:***') as who, count from public.api_usage where day = current_date order by count desc limit 8;" | jq -c '.[]' || true
          echo "==> 驗證照片"
          photo=$(echo "$res" | jq -r '.places[0].photos[0].name // empty')
          if [ -n "$photo" ]; then
            for w in 240 800; do
              curl -sS -o /tmp/img -D /tmp/h -w "photo w=$w: HTTP %{http_code} type=%{content_type} bytes=%{size_download} time=%{time_total}s\n" "$url/functions/v1/places/photo?name=$photo&w=$w"
              grep -i "x-cache" /tmp/h || true
              file /tmp/img | cut -c1-80 || true
            done
          fi
