name: Supabase 執行 SQL

# 對已建立的 Supabase 專案執行指定的 migration 檔（每個檔案各自一次交易）。
# 權杖來自 repo 的 Secret「SUPABASE_ACCESS_TOKEN」。
on:
  workflow_dispatch:
    inputs:
      files:
        description: '要執行的 SQL 檔，逗號分隔（相對 supabase/migrations/）'
        required: true
        default: '0010_negative_body.sql'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 執行
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FILES: ${{ inputs.files }}
        run: |
          set -euo pipefail
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '[:space:]')
          if [ -z "$TOKEN" ]; then
            echo "::error::尚未設定 Secret SUPABASE_ACCESS_TOKEN（repo Settings → Secrets and variables → Actions）"; exit 1
          fi
          ref=$(jq -r .SUPABASE_URL dart_defines.json | sed -E 's#https://([^.]+)\.supabase\.co#\1#')
          IFS=',' read -ra list <<< "$FILES"
          for f in "${list[@]}"; do
            f=$(echo "$f" | xargs)
            echo "==> $f"
            result=$(curl -sS -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              -X POST "https://api.supabase.com/v1/projects/$ref/database/query" \
              -d "$(jq -n --rawfile q "supabase/migrations/$f" '{query:$q}')")
            if echo "$result" | jq -e 'type=="object" and .message' >/dev/null 2>&1; then
              echo "::error::$f 失敗：$(echo "$result" | jq -r '.message')"; exit 1
            fi
            echo "  完成"
          done
