name: crownmine
description: 美食地圖 Food Map：只屬於這個 App 的餐廳評價。
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  http: ^1.2.2
  flutter_svg: ^2.0.10
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  geolocator: ^13.0.1
  google_maps_flutter: ^2.18.2
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  pointer_interceptor: ^0.10.1+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

# App 圖示：dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: assets/icon/app_icon.png
  adaptive_icon_foreground: assets/icon/app_icon_fg.png
  web:
    generate: false
