name: crownmine
description: 只屬於這個 App 的餐廳評價：真心推薦給皇冠，普通又貴給地雷。
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  http: ^1.2.2
  flutter_svg: ^2.0.10
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  geolocator: ^13.0.1
  google_maps_flutter: ^2.18.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
