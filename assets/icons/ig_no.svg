<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 相機 App 圖示（圓角方形 + 鏡頭環 + 小點） -->
  <rect x="17" y="17" width="30" height="30" rx="8" fill="none" stroke="#7B1FA2" stroke-width="4"/>
  <circle cx="32" cy="32" r="7" fill="none" stroke="#7B1FA2" stroke-width="4"/>
  <circle cx="40.5" cy="23.5" r="2.2" fill="#7B1FA2"/>
  <!-- 紅色禁止圈與斜線 -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#D32F2F" stroke-width="6"/>
  <line x1="13.5" y1="13.5" x2="50.5" y2="50.5" stroke="#D32F2F" stroke-width="6" stroke-linecap="round"/>
</svg>
