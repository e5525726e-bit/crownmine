<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 白飯滿出來的碗：好吃便宜又大碗 -->
  <!-- 掉出來的飯粒 -->
  <g fill="#FFFFFF" stroke="#9E9E9E" stroke-width="1.6">
    <ellipse cx="9" cy="36" rx="3" ry="2" transform="rotate(-25 9 36)"/>
    <ellipse cx="55" cy="35" rx="3" ry="2" transform="rotate(20 55 35)"/>
    <ellipse cx="12" cy="45" rx="2.6" ry="1.8" transform="rotate(10 12 45)"/>
    <ellipse cx="53" cy="44" rx="2.6" ry="1.8" transform="rotate(-15 53 44)"/>
  </g>
  <!-- 滿出來的飯（堆得比碗高很多） -->
  <path d="M14 34 C12 22 20 8 32 8 C44 8 52 22 50 34 Z" fill="#FFFFFF" stroke="#9E9E9E" stroke-width="3" stroke-linejoin="round"/>
  <!-- 飯粒紋路 -->
  <g fill="none" stroke="#D6D6D6" stroke-width="2" stroke-linecap="round">
    <path d="M24 18 C26 16 28 16 30 18"/>
    <path d="M35 14 C37 12 39 12 41 14"/>
    <path d="M20 27 C22 25 24 25 26 27"/>
    <path d="M33 24 C35 22 37 22 39 24"/>
    <path d="M42 29 C44 27 46 27 48 29"/>
  </g>
  <!-- 碗 -->
  <path d="M8 34 L56 34 C56 46 48 56 32 56 C16 56 8 46 8 34 Z" fill="#1E88E5" stroke="#0D47A1" stroke-width="3" stroke-linejoin="round"/>
  <!-- 碗緣與花紋 -->
  <path d="M8 34 L56 34" stroke="#0D47A1" stroke-width="3"/>
  <path d="M12 41 C20 38 44 38 52 41" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <!-- 碗底 -->
  <rect x="24" y="55" width="16" height="4" rx="2" fill="#0D47A1"/>
</svg>
