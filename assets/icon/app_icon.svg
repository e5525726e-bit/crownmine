<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#123B2E"/>
      <stop offset="1" stop-color="#071C15"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34E27A" stop-opacity="0"/>
      <stop offset="1" stop-color="#34E27A" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="cheese" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE082"/>
      <stop offset="1" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0A05A"/>
      <stop offset="1" stop-color="#B8742E"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- 雷達：同心圓與十字線 -->
  <g fill="none" stroke="#34E27A" stroke-opacity="0.55" stroke-width="6">
    <circle cx="512" cy="512" r="150"/>
    <circle cx="512" cy="512" r="290"/>
    <circle cx="512" cy="512" r="430"/>
  </g>
  <g stroke="#34E27A" stroke-opacity="0.35" stroke-width="5">
    <line x1="512" y1="82" x2="512" y2="942"/>
    <line x1="82" y1="512" x2="942" y2="512"/>
  </g>
  <!-- 掃描扇形（右上 90 度） -->
  <path d="M512 512 L512 82 A430 430 0 0 1 942 512 Z" fill="url(#sweep)"/>
  <line x1="512" y1="512" x2="942" y2="512" stroke="#7CFFB0" stroke-width="8" stroke-linecap="round"/>
  <!-- 光點 -->
  <circle cx="700" cy="330" r="14" fill="#7CFFB0"/>
  <circle cx="330" cy="720" r="10" fill="#7CFFB0" opacity="0.6"/>
  <circle cx="790" cy="690" r="9" fill="#7CFFB0" opacity="0.4"/>

  <!-- 披薩（尖端朝下的三角形，餅皮在上） -->
  <g transform="translate(512,512) rotate(45) scale(0.85)">
    <!-- 陰影 -->
    <path d="M-190 -170 Q0 -235 190 -170 L14 230 Q0 250 -14 230 Z" fill="#000" opacity="0.35" transform="translate(0,18)"/>
    <!-- 餅皮外弧 -->
    <path d="M-200 -160 Q0 -240 200 -160 L172 -108 Q0 -170 -172 -108 Z" fill="url(#crust)" stroke="#8C5A23" stroke-width="10" stroke-linejoin="round"/>
    <!-- 起司 -->
    <path d="M-172 -108 Q0 -170 172 -108 L12 236 Q0 252 -12 236 Z" fill="url(#cheese)" stroke="#C98A00" stroke-width="10" stroke-linejoin="round"/>
    <!-- 臘腸 -->
    <g fill="#D63B2F" stroke="#9E2418" stroke-width="6">
      <circle cx="-80" cy="-50" r="34"/>
      <circle cx="70" cy="-30" r="34"/>
      <circle cx="-10" cy="60" r="32"/>
      <circle cx="30" cy="150" r="24"/>
    </g>
    <!-- 起司光澤 -->
    <path d="M-120 -120 Q-60 -140 0 -130" fill="none" stroke="#FFF3C4" stroke-width="10" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
